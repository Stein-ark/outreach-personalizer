<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#f2f4f7"},
    {"id":"color-surface","type":"color","label":"Surface","default":"#ffffff"},
    {"id":"color-ink","type":"color","label":"Text","default":"#18233a"},
    {"id":"color-ink-soft","type":"color","label":"Soft text","default":"#4a5672"},
    {"id":"color-rule","type":"color","label":"Rules","default":"#d5dbe5"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#0f7a64"},
    {"id":"color-accent-soft","type":"color","label":"Accent soft","default":"#e3f3ee"},
    {"id":"font-display","type":"string","label":"UI font","default":"Inter"},
    {"id":"font-letter","type":"string","label":"Letter font","default":"EB Garamond"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* The extension's own palette (extension/entrypoints/sidepanel/style.css). */
      :root {
        --color-ground: #f2f4f7;
        --color-surface: #ffffff;
        --color-sheet: #fbfcfd;
        --color-ink: #18233a;
        --color-ink-soft: #4a5672;
        --color-rule: #d5dbe5;
        --color-accent: #0f7a64;
        --color-accent-soft: #e3f3ee;
        --font-display: "Inter";
        --font-letter: "EB Garamond";
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
        font-family: var(--font-display), sans-serif;
        color: var(--color-ink);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      /* A soft local light on the paper, so the ground is not a flat fill (radial: no banding under H.264). */
      #ground {
        position: absolute;
        inset: 0;
        background: radial-gradient(1100px 700px at 30% 35%, #fbfcfd 0%, var(--color-ground) 70%);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="40" data-width="1920" data-height="1080">
      <div id="ground"></div>

      <!-- Scenes: the narration is the clock. Each scene lasts its voice line plus a breath. -->
      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1.html" data-start="0" data-duration="6.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2.html" data-start="6.5" data-duration="7.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3.html" data-start="13.7" data-duration="7.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s4" data-composition-id="s4" data-composition-src="compositions/s4.html" data-start="20.9" data-duration="6.1" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s5" data-composition-id="s5" data-composition-src="compositions/s5.html" data-start="27" data-duration="7.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s6" data-composition-id="s6" data-composition-src="compositions/s6.html" data-start="34.5" data-duration="5.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- Voice: Kokoro bm_george (British male), one line per scene. -->
      <audio id="vo1" class="clip" data-start="0.3" data-duration="5.99" data-track-index="3" data-volume="1" src="assets/vo/vo1.wav"></audio>
      <audio id="vo2" class="clip" data-start="6.75" data-duration="6.89" data-track-index="3" data-volume="1" src="assets/vo/vo2.wav"></audio>
      <audio id="vo3" class="clip" data-start="13.9" data-duration="6.93" data-track-index="3" data-volume="1" src="assets/vo/vo3.wav"></audio>
      <audio id="vo4" class="clip" data-start="21.05" data-duration="5.93" data-track-index="3" data-volume="1" src="assets/vo/vo4.wav"></audio>
      <audio id="vo5" class="clip" data-start="27.2" data-duration="7.21" data-track-index="3" data-volume="1" src="assets/vo/vo5.wav"></audio>
      <audio id="vo6" class="clip" data-start="34.7" data-duration="3.58" data-track-index="3" data-volume="1" src="assets/vo/vo6.wav"></audio>

      <!-- Music bed under the voice (CC BY 4.0, Sascha Ende, ende.app). -->
      <audio id="music" class="clip" data-start="0" data-duration="40" data-track-index="10" data-volume="0.15" data-fade-in="0.8" data-fade-out="2.2" src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3"></audio>

      <!-- Sound only where something visibly happens. -->
      <audio id="sfx-icon-click" class="clip" data-start="7.28" data-duration="0.6" data-track-index="11" data-volume="0.6" src="assets/sfx/ui/mouseclick1.ogg"></audio>
      <audio id="sfx-panel" class="clip" data-start="7.75" data-duration="0.8" data-track-index="12" data-volume="0.45" src="assets/sfx/interface/drop_002.ogg"></audio>
      <!-- beat-locked: 22.93s, the sheet file lands in Downloads -->
      <audio id="sfx-saved" class="clip" data-start="22.93" data-duration="2.5" data-track-index="13" data-volume="0.4" src="assets/sfx/impact/impactBell_heavy_000.ogg"></audio>
      <audio id="sfx-draft-click" class="clip" data-start="29.88" data-duration="0.6" data-track-index="14" data-volume="0.6" src="assets/sfx/ui/click3.ogg"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
