  <script>
    const tl = gsap.timeline({ paused: true });
    // Split the message into characters once at build time, so it can type itself.
    const field = document.getElementById("s5-type");
    const text = field.textContent;
    field.textContent = "";
    const chars = [...text].map((ch) => {
      const s = document.createElement("span");
      s.textContent = ch;
      field.appendChild(s);
      return s;
    });

    // "Fancy saying something?": the composer rises in.
    tl.fromTo("#s5-composer", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.05);
    tl.set(["#s5-letter", "#s5-status"], { opacity: 0 }, 0);

    // "Write it once": the message types itself (0.9s to 2.55s).
    tl.fromTo(chars, { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 1.65 / chars.length, ease: "none" }, 0.9);

    // "The A.I. drafts": the cursor clicks Draft at 2.88s (sound at 29.88s).
    tl.fromTo("#s5-cursor", { x: 640, y: 980, opacity: 0 }, { x: 520, y: 760, opacity: 1, duration: 0.55, ease: "power2.inOut" }, 2.25);
    tl.fromTo("#s5-btn", { scale: 1 }, { scale: 0.97, duration: 0.08, ease: "power2.in" }, 2.86);
    tl.fromTo("#s5-btn", { scale: 0.97 }, { scale: 1, duration: 0.25, ease: "power3.out" }, 2.94);
    tl.fromTo("#s5-cursor", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, 3.5);

    // "one message for the whole sheet": the letter arrives, and the sheet is updated.
    tl.fromTo("#s5-letter", { opacity: 0, x: 60, filter: "blur(10px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 3.3);
    tl.fromTo("#s5-status", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 3.95);

    // "opt-out line included" (6.0s): the line is marked.
    tl.fromTo("#s5-mark", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 6.0);

    tl.fromTo(["#s5-composer", "#s5-letter"], { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.22, ease: "power2.in" }, 7.25);
    window.__timelines["s5"] = tl;
  </script>
