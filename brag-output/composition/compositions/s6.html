  </style>
  <div id="root" data-composition-id="s6" data-width="1920" data-height="1080">
    <div class="s6-wrap">
      <div id="s6-icon" class="s6-icon">
        <svg width="74" height="54" viewBox="0 0 30 22" aria-hidden="true"><rect x="2" y="2" width="26" height="18" rx="3" fill="none" stroke="#ffffff" stroke-width="2.6" /><path d="M3 4 L15 13 L27 4" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round" /></svg>
        <div class="s6-dot"></div>
      </div>
      <div id="s6-name" class="s6-name">Outreach Personalizer</div>
      <div class="s6-lines">
        <div id="s6-a">You browse.</div>
        <div id="s6-b">It keeps the <em>list</em>.</div>
      </div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // Letters of the name, split once at build time.
    const name = document.getElementById("s6-name");
    const letters = [...name.textContent].map((ch) => {
      const s = document.createElement("span");
      s.textContent = ch === " " ? " " : ch;
      return s;
    });
    name.textContent = "";
    letters.forEach((s) => name.appendChild(s));

    // "Outreach Personalizer." (0.2s): the mark, then the name letter by letter.
    tl.fromTo("#s6-icon", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 0.05);
    tl.fromTo(letters, { opacity: 0.0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, stagger: 0.03, ease: "power4.out" }, 0.2);
    // "You browse." (2.08s) and "It keeps the list." (2.94s): each lands on its word, then holds still.
    tl.fromTo("#s6-a", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 2.08);
    tl.fromTo("#s6-b", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 2.94);
    window.__timelines["s6"] = tl;
  </script>
